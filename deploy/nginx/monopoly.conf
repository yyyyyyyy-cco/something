# monopoly 反向代理配置
# 基于《新项目服务上线规范》§2.1 模板 + 本项目补丁：
#   ① /socket.io/ WebSocket 升级与长连接（模板未含，Socket.IO 必需）
#   ② Vite 构建产物 /assets/ 与 favicon 豁免限流
#   ③ 无登录接口：login 限流块备用（默认注释，接入账号体系时启用）
# 上线时将 <域名> 全局替换为实际域名后放入 ~/nginx-proxy/conf.d/<域名>.conf

# ---------- HTTP → HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name <域名>;

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 强制跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 反向代理 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <域名>;

    # SSL 证书（certbot 申请后挂载于 nginx-proxy）
    ssl_certificate     /etc/nginx/ssl/<域名>/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/<域名>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全响应头（CSP 的 connect-src 含 wss: —— WebSocket 必需）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;

    # 隐藏 nginx 版本号
    server_tokens off;

    # ① Socket.IO（WebSocket 升级 + 长连接；流式连接不限流，参照规范 SSE 条款）
    location /socket.io/ {
        proxy_pass http://monopoly:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # ② Vite 构建产物（高频静态文件，豁免限流，防首屏并发误伤）
    location /assets/ {
        proxy_pass http://monopoly:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # favicon 直通（小文件高频）
    location = /favicon.ico {
        proxy_pass http://monopoly:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ③ 登录接口限流（备用：本项目 P0 无登录接口，接入账号体系时取消注释）
    # location = /api/auth/login {
    #     limit_req zone=login burst=3 nodelay;
    #     limit_req_status 429;
    #     error_page 429 = @rate_limited;
    #     proxy_pass http://monopoly:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 429 统一 JSON 响应
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"请求过于频繁，请稍后重试"}';
    }

    # 动态页面与业务 API（默认 20r/s 限流，burst 40）
    location / {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;
        proxy_pass http://monopoly:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
